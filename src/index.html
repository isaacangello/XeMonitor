<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XeMonitor Bridge</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #e0e0e0;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  h1 {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(to right, #888888, #ff0000);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: #aaa;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }

  .status-dot.connected { background: #4caf50; box-shadow: 0 0 8px #4caf5066; }
  .status-dot.disconnected { background: #f44336; box-shadow: 0 0 8px #f4433666; }

  .barcode-card {
    width: 100%;
    background: #2a2a2a;
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .barcode-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #888;
    margin-bottom: 0.5rem;
  }

  .barcode-value {
    font-family: 'Courier New', monospace;
    font-size: 2.4rem;
    font-weight: 700;
    color: #fff;
    min-height: 3.2rem;
    word-break: break-all;
    transition: color 0.2s;
  }

  .barcode-value.highlight { color: #ff4444; }

  .history-section {
    width: 100%;
  }

  .history-section h2 {
    font-size: 1rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 0.75rem;
  }

  .history-list {
    list-style: none;
    width: 100%;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-list li {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    padding: 0.4rem 0.8rem;
    background: #222;
    border-radius: 6px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .history-list li:first-child {
    border-left: 3px solid #ff4444;
  }

  .footer {
    font-size: 0.75rem;
    color: #555;
  }
</style>
</head>
<body>
<div class="container">
  <h1>XeMonitor</h1>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Conectando...</span>
  </div>

  <div class="barcode-card">
    <div class="barcode-label">Último Código</div>
    <div class="barcode-value" id="barcode">---</div>
  </div>

  <div class="history-section">
    <h2>Histórico</h2>
    <ul class="history-list" id="historyList"></ul>
  </div>

  <div class="footer">XeMonitor Bridge &mdash; escaneie um código de barras</div>
</div>

<script>
  const barcodeEl = document.getElementById('barcode');
  const historyList = document.getElementById('historyList');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const es = new EventSource('/stream');

  es.onopen = () => {
    statusDot.className = 'status-dot connected';
    statusText.textContent = 'Conectado';
  };

  es.onmessage = (event) => {
    const code = event.data;
    barcodeEl.textContent = code;
    barcodeEl.className = 'barcode-value highlight';
    setTimeout(() => { barcodeEl.className = 'barcode-value'; }, 400);

    const li = document.createElement('li');
    li.textContent = code;
    historyList.insertBefore(li, historyList.firstChild);

    while (historyList.children.length > 50) {
      historyList.removeChild(historyList.lastChild);
    }
  };

  es.onerror = () => {
    statusDot.className = 'status-dot disconnected';
    statusText.textContent = 'Desconectado';
  };
</script>
</body>
</html>
