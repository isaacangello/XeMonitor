services:
  windows:
    image: dockurr/windows
    container_name: xm-win-test
    environment:
      VERSION: "10l"
      RAM_SIZE: "6G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      USERNAME: "xemonitor"
      PASSWORD: "xemonitor"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3390:3389
      - 3390:3389/udp
    volumes:
      - /home/isaacca/xm-win:/storage
      - /home/isaacca/hd/Codigos/XeMonitor/xemonitor:/shared
    restart: "no"
    stop_grace_period: 2m
