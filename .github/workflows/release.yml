name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries (musl static)
    # ubuntu-22.04 (glibc 2.35): baseline mínimo p/ o xemonitor-gui (glibc).
    # Roda em Ubuntu 22.04+, Debian 12+ e derivados; musl não é afetado.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        run: |
          curl -fsSL https://ziglang.org/download/index.json -o /tmp/zig-index.json
          ZIG_URL=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['0.16.0']['x86_64-linux']['tarball'])")
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
          mkdir -p ~/.cache/zig/tmp

      - name: Install GUI dependency (dbus headers)
        # SDL3 é compilado de fonte pelo próprio dvui (pacotes sdl/sdl_linux_deps
        # do Zig); só o dbus do sistema (bandeja SNI) precisa de headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev

      - name: Build xemonitor (x86_64-linux-musl)
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe

      - name: Build bridge (x86_64-linux-musl)
        run: zig build bridge -Doptimize=ReleaseSafe

      - name: Build GUI (x86_64-linux-gnu, SDL3 de fonte + dbus do sistema)
        run: zig build gui -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

      - name: Package release tarball
        run: |
          mkdir -p dist
          cp zig-out/bin/xemonitor dist/xemonitor
          cp zig-out/bin/bridge dist/xemonitor-bridge
          cp zig-out/bin/xemonitor-gui dist/xemonitor-gui
          cp uninstall.sh dist/xemonitor-uninstall
          chmod +x dist/xemonitor-uninstall
          tar -czf xemonitor-linux-x86_64.tar.gz -C dist xemonitor xemonitor-bridge xemonitor-gui xemonitor-uninstall
          sha256sum xemonitor-linux-x86_64.tar.gz | tee xemonitor-linux-x86_64.tar.gz.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xemonitor-linux-x86_64.tar.gz
            xemonitor-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
