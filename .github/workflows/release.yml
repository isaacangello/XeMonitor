name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries (musl static)
    # ubuntu-22.04 (glibc 2.35): baseline mínimo p/ o xemonitor-gui (glibc).
    # Roda em Ubuntu 22.04+, Debian 12+ e derivados; musl não é afetado.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        run: |
          curl -fsSL https://ziglang.org/download/index.json -o /tmp/zig-index.json
          ZIG_URL=$(python3 -c "import json;print(json.load(open('/tmp/zig-index.json'))['0.16.0']['x86_64-linux']['tarball'])")
          curl -fsSL "$ZIG_URL" -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
          mkdir -p ~/.cache/zig/tmp

      - name: Install GUI dependency (dbus headers)
        # SDL3 é compilado de fonte pelo próprio dvui (pacotes sdl/sdl_linux_deps
        # do Zig); só o dbus do sistema (bandeja SNI) precisa de headers.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev

      - name: Build xemonitor (x86_64-linux-musl)
        run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe

      - name: Build bridge (x86_64-linux-musl)
        run: zig build bridge -Doptimize=ReleaseSafe

      - name: Build GUI (x86_64-linux-gnu, SDL3 de fonte + dbus do sistema)
        run: zig build gui -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe

      - name: Validate install.sh (check-only)
        run: |
          bash install.sh --check-only

      - name: Build miniroot Alpine (pre-baked with this bridge)
        run: |
          bash scripts/build_miniroot_ci.sh \
            --bridge-version "$(cat VERSION)" \
            --bridge-build  "${{ github.ref_name }}" \
            --bridge        "zig-out/bin/bridge" \
            --init          "openrc/xemonitor-bridge" \
            --out-dir       "packaging/windows/miniroots"
        # O ref_name v* vira o "build" do miniroot (ex: v0.8.0 -> bridge 0.8.0.v0.8.0)
        # e a release tag vira o nome do tarball (alpine-bridge-0.8.0.v0.8.0-...tar.gz).
        # Se preferir build numerico, troque "${{ github.ref_name }}" por um counter.
      - name: Prepare miniroot for Inno Setup (copy as alpine-bridge-current.tar.gz)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare_miniroot_for_iss.ps1
        shell: pwsh

      - name: Upload miniroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniroot-bridge
          path: |
            packaging/windows/miniroots/alpine-bridge-*.tar.gz
            packaging/windows/miniroots/alpine-bridge-current.tar.gz

      - name: Package release tarball
        run: |
          mkdir -p dist
          cp zig-out/bin/xemonitor dist/xemonitor
          cp zig-out/bin/bridge dist/xemonitor-bridge
          cp zig-out/bin/xemonitor-gui dist/xemonitor-gui
          cp uninstall.sh dist/xemonitor-uninstall
          chmod +x dist/xemonitor-uninstall
          # Diagnostico/auto-recuperacao (instalado como /usr/local/bin/xemonitor-diagnose).
          cp diagnose_xemonitor.sh dist/xemonitor-diagnose
          chmod +x dist/xemonitor-diagnose
          # Ícone do app (hicolor 512x512; renomeado sem espaço p/ o tar)
          cp "src/Barcode Scanner.png" dist/xemonitor.png
          mkdir -p dist/openrc dist/systemd dist/scripts
          cp openrc/xemonitor-bridge dist/openrc/xemonitor-bridge
          cp systemd/xemonitor-bridge.service dist/systemd/xemonitor-bridge.service
          cp scripts/install_bridge_service.sh dist/scripts/install_bridge_service.sh
          tar -czf xemonitor-linux-x86_64.tar.gz -C dist xemonitor xemonitor-bridge xemonitor-gui xemonitor-uninstall xemonitor-diagnose xemonitor.png openrc systemd scripts
          sha256sum xemonitor-linux-x86_64.tar.gz | tee xemonitor-linux-x86_64.tar.gz.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            xemonitor-linux-x86_64.tar.gz
            xemonitor-linux-x86_64.tar.gz.sha256

  build-windows:
    name: Build Windows binaries + Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        run: |
          $zigVersion = "0.16.0"
          $zigUrl = "https://ziglang.org/download/$zigVersion/zig-x86_64-windows-$zigVersion.zip"
          Invoke-WebRequest -Uri $zigUrl -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath zig
          $zigDir = Get-ChildItem zig | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          echo "ZIG_PATH=$($zigDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "ZIG_GLOBAL_CACHE_DIR=$env:USERPROFILE\.cache\zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$($zigDir.FullName)\zig.exe" version
        shell: pwsh

      - name: Setup Zig cache
        run: |
          mkdir -p "$env:USERPROFILE\.cache\zig\tmp"
        shell: pwsh

      - name: Install MSYS2 and libserialport
        run: |
          choco install msys2 -y --no-progress
          $msys2Path = "C:\msys64\usr\bin\bash.exe"
          & $msys2Path -lc "pacman -Sy --noconfirm mingw-w64-x86_64-libserialport"
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build xemonitor (x86_64-windows)
        run: '& "$env:ZIG_PATH\zig.exe" build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe'
        shell: pwsh

      - name: Build GUI (x86_64-windows)
        run: '& "$env:ZIG_PATH\zig.exe" build gui -Dtarget=x86_64-windows -Doptimize=ReleaseFast'
        shell: pwsh

      - name: Build bridge (x86_64-linux-musl)
        run: '& "$env:ZIG_PATH\zig.exe" build bridge -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe'
        shell: pwsh

      - name: Download miniroot from build-linux
        uses: actions/download-artifact@v4
        with:
          name: miniroot-bridge
          path: packaging/windows/miniroots

      - name: Copy Windows binaries to dist
        run: |
          mkdir -p dist
          Copy-Item zig-out\bin\xemonitor.exe dist\xemonitor.exe
          Copy-Item zig-out\bin\xemonitor-gui.exe dist\xemonitor-gui.exe
        shell: pwsh

      - name: Compile Inno Setup Installer
        run: |
          $issc = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          if (-not $issc) {
            $issc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $issc)) {
            $issc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $issc)) {
            Write-Error "ISCC.exe not found"
            exit 1
          }
          # Versao do instalador: vem do arquivo VERSION (fonte unica de versao).
          $ver = (Get-Content VERSION | Select-Object -First 1).Trim()
          & $issc "/DMyAppVersion=$ver" packaging\windows\xemonitor.iss
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\XeMonitor-*-setup.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: windows-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-artifacts/xemonitor-linux-x86_64.tar.gz
            linux-artifacts/xemonitor-linux-x86_64.tar.gz.sha256
            windows-artifacts/XeMonitor-*-setup.exe
          generate_release_notes: true
